name: Release

# Construye los paquetes instalables de cada sistema.
#   - Al subir una etiqueta v* (p. ej. v0.1.0): los adjunta a una GitHub Release.
#   - A mano (Actions → Release → Run workflow): los deja como artefactos descargables.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter test
      - run: ./scripts/package-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/IPTV-Launcher-windows.zip }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libmpv-dev mpv libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/IPTV-Launcher-linux-x64.tar.gz }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/IPTV-Launcher-macos.zip }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      # Sin clave de firma propia, el APK se firma con la de depuración: sirve para instalar
      # directamente en un dispositivo, no para publicar en Google Play.
      - run: flutter build apk --release
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/IPTV-Launcher-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/IPTV-Launcher-android.apk }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
