name: Release

# Construye los paquetes instalables de cada sistema.
#   - Al subir una etiqueta v* (p. ej. v0.1.0): los adjunta a una GitHub Release.
#   - A mano (Actions → Release → Run workflow): los deja como artefactos descargables.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter test
      - run: ./scripts/package-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/Lumio-windows.zip }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libmpv-dev mpv libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/Lumio-linux-x64.tar.gz }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/Lumio-macos.zip }

  android:
    runs-on: ubuntu-latest
    env:
      # Secretos de la clave de subida a Google Play (ver store/android/PUBLICAR.md).
      # Sin ellos el APK se firma con la clave de depuración y no se genera el AAB.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - name: Clave de firma (si hay secretos)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/lumio-upload.p12
          printf 'storeFile=lumio-upload.p12\nstorePassword=%s\nkeyAlias=lumio-upload\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
      - run: flutter build apk --release
      - name: AAB para Google Play (solo con clave de firma)
        if: env.KEYSTORE_B64 != ''
        run: flutter build appbundle --release
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Lumio-android.apk
          [ -f build/app/outputs/bundle/release/app-release.aab ] && cp build/app/outputs/bundle/release/app-release.aab dist/Lumio-android.aab || true
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/Lumio-android.apk }
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with: { name: android-aab, path: dist/Lumio-android.aab }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: rm -f artifacts/*.aab # el AAB es solo para Google Play
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
