name: lumio
description: "Lumio, reproductor IPTV moderno y multidispositivo (Android, iOS, Windows, macOS y Linux) desde una única base de código."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1

  # Vídeo (libmpv, hwdec en las 5 plataformas)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Networking
  dio: ^5.4.3
  path_provider: ^2.1.3
  file_picker: ^8.1.2
  flutter_secure_storage: ^9.2.2
  cast: ^2.1.0
  bonsoir: 5.1.11

  # Fase 2+ (descomentar al implementarlas)
  # drift: ^2.18.0            # SQLite indexado: canales, EPG, historial
  # sqlite3_flutter_libs: ^0.5.0
  # window_manager: ^0.4.0    # always-on-top / PiP desktop
  # purchases_flutter: ^7.0.0 # RevenueCat (móvil)

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# Iconos de cada plataforma, generados desde assets/branding (ver CLAUDE.md):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/lumio_icon_square.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "assets/branding/lumio_bg.png"
  adaptive_icon_foreground: "assets/branding/lumio_foreground.png"
  adaptive_icon_monochrome: "assets/branding/lumio_mono.png"
  windows:
    generate: true
    image_path: "assets/branding/lumio_icon_round.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/branding/lumio_icon_round.png"

flutter:
  uses-material-design: true
  generate: true
