name: iptv_launcher
description: IPTV player multidispositivo (Android, iOS, Windows, macOS, Linux) desde una única base de código.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Vídeo (libmpv, hwdec en las 5 plataformas)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Networking
  dio: ^5.4.3
  path_provider: ^2.1.3
  file_picker: ^8.1.2

  # Fase 2+ (descomentar al implementarlas)
  # drift: ^2.18.0            # SQLite indexado: canales, EPG, historial
  # sqlite3_flutter_libs: ^0.5.0
  # window_manager: ^0.4.0    # always-on-top / PiP desktop
  # purchases_flutter: ^7.0.0 # RevenueCat (móvil)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
